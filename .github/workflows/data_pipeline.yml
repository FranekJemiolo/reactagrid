name: Automated Chemical ETL Pipeline

on:
  schedule:
    # Run weekly on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  ingest-and-validate:
    name: Chemical ETL & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python ETL Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Execute Automated Ingestion ETL Pipeline
        run: |
          python3 data-pipeline/etl_ingestion.py

      - name: Validate Chemical Schema & Integrity
        run: |
          python3 data-pipeline/validate_schema.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Verify TypeScript Types & Engine Tests
        run: |
          npm run type-check
          npm run test
